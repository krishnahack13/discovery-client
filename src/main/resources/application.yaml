spring:
  application:
    name: discovery-client
  cache:
    cache-names:
      - auditEventTypes
    caffeine:
      spec: maximumSize=100, expireAfterWrite=24h

  # H2 Configuration (uncomment all below for local testing with H2)
  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console
  #     settings:
  #       web-allow-others: true
  #   show-sql: true

  # H2 Database Configuration (for local testing)
  # datasource:
  #   jdbc-url: jdbc:h2:file:./testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  #   driver-class-name: org.h2.Driver
  #   username: sa
  #   password:
  #   hikari:
  #     pool-name: H2Pool
  #     maximum-pool-size: 10

  # MySQL Database Configuration (for production)
  datasource:
    jdbc-url: jdbc:mysql://vistora-mysql.cbq60mg2m13d.eu-north-1.rds.amazonaws.com:3306/t_example
    username: sushant_shubham
    password: sushant@grafyn
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: DiscoveryClientServiceHikariPool
      maximum-pool-size: 3          # max 3 connections per local instance (5 devs × 3 = 15 total max)
      minimum-idle: 0               # release ALL idle connections; connections are created on demand
                                    # → no sleeping connections held open when nobody uses the app
      idle-timeout: 30000           # return a connection to pool after 30 s idle (was 60 s)
      max-lifetime: 300000          # recycle connections after 5 min (was 60 min) — prevents stale TCP
      connection-timeout: 15000     # fail fast if pool exhausted (15 s)
      leak-detection-threshold: 60000  # warn after 60 s if a connection is not returned
      register-mbeans: true
      connection-test-query: SELECT 1
      # keepalive-time REMOVED — it was pinging MySQL every 60 s to keep sleeping
      # connections alive, which defeats the purpose of idle-timeout entirely.
      # MySQL's own wait_timeout will close truly idle connections on its side.
      #
      # initialization-fail-timeout REMOVED (was -1).
      # -1 means "start even if DB is unreachable", which can cause uncontrolled
      # connection-retry storms at startup when the DB is slow. Default (1) is safer.
      connection-init-sql: SET SESSION sql_mode='TRADITIONAL'

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        # Important: Enable physical naming strategy to respect schema
        globally_quoted_identifiers: false
        # MySQL dialect for production
        dialect: org.hibernate.dialect.MySQL8Dialect
        # Hibernate batch insert configuration for audit logging performance
        jdbc:
          batch_size: 50  # Process 50 inserts per batch
        order_inserts: true  # Order inserts for better batching
        order_updates: true  # Order updates for better batching

