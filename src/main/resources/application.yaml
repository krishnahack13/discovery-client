agents-monitor:
  ai-signatures:
    enabled: true
    browser-extension-activity-threshold-days: 7
    ai-keywords:
      - gpt
      - chatgpt
      - copilot
      - claude
      - gemini
      - bard
      - llm
      - openai
      - anthropic
      - codium
      - codeium
    initial-catalog:
      - tool-name: Cursor AI (IDE)
        process-names: [cursor, Cursor.exe]
        extension-ids: [cursor.cursor-tutor]
        allowed: true
        category: IDE tool
      - tool-name: Claude CLI
        process-names: [claude, claude.exe, anthropic, anthropic.exe]
        env-variable-signatures: [ANTHROPIC_API_KEY, CLAUDE_API_KEY]
        config-file-signatures: [.anthropic]
        allowed: true
        category: CLI
      - tool-name: GitHub Copilot
        extension-ids: [github.copilot, github-copilot-intellij]
        allowed: true
        category: IDE tool
      - tool-name: Windows Copilot
        process-names: [Copilot.exe, copilot]
        allowed: true
        category: Developer App
      - tool-name: Windsurf AI
        process-names: [windsurf, windsurf.exe]
        extension-ids: [exafunction.codeium]
        allowed: true
        category: Developer App
      - tool-name: Devin AI Agent
        process-names: [devin, devin.exe]
        allowed: true
        category: Developer App
      - tool-name: Ollama
        process-names: [ollama, ollama.exe, ollama_llama_server.exe, llama-server]
        known-ports: [11434]
        allowed: true
        category: Local LLM
      - tool-name: Google Gemini
        process-names: [gemini, gemini.exe, GoogleGemini, gemini-web]
        allowed: true
        category: AI Assistant
  # AWS credenials
org.aws.access-key-id: ${AWS_ACCESS_KEY}
org.aws.secret-access-key: ${AWS_SECRET_KEY}

